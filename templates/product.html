{% extends "base.html" %}
{% block title %}AI Arts{% endblock %}

{% block content %}

    <div class="container my-3">
        <div class="card border-0 shadow-sm">
            <div class="row g-0">
                <!-- Image and description -->
                <div class="col-md-8">
                    <img src={{ product.image_url }} class="img-fluid rounded-start" style="max-height: 700px; object-fit: contain; width: 100%;" alt="Product image">
                    <div class="card-body">
                        <h5 class="card-title mt-3">Product Description</h5>
                        <p class="card-text">{{ product.description }}</p>
                    </div>
                </div>
                <!-- Name, price, button, delivery text -->
                <div class="col-md-4">
                    <div class="card-body d-flex flex-column h-100" style="margin-top: 50px;">
                        <h3 class="card-title mb-3">{{ product.name }}</h3>
                        <h4 class="card-title pricing-card-title mb-4">{{ "%.2f"|format(product.price_with_tax) }} €<span class="text-body-secondary fw-light"></span></h4>
                        
                        <p class="card-text"></p>
                        <form action="{{ url_for('manage_cart') }}" method="POST" class="mb-4 ajax-form">
                            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                            <input type="hidden" name="product_id" value="{{ product.id }}">
                            <div class="input-group align-items-center">
                                <label for="quantity" class="form-label me-2">Quantity:</label>
                                <input type="number" id="quantity" name="quantity" value="1" min="1" class="form-control" style="width: 30px;">
                                <button type="submit" class="btn btn-primary ms-2">Add to Cart</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

{% endblock %}
