{% extends "base.html" %}
{% block title %}AI Arts{% endblock %}

{% block content %}
<div class="my-4"></div>
<div class="container" style="padding-left: 20px; padding-right: 20px;">
<div class="row row-cols-1 row-cols-md-3 mb-3 text-center">
    {% for product in products %}
    <div class="col">
        <div class="card mb-4 rounded-3 shadow-sm">
            <a href="{{ url_for('view_product', product_name=product.name) }}" style="text-decoration: none;">
                <img src={{ product.image_url }} class="img-fluid w-100" style="max-height: 400px; object-fit: contain;" alt="Product image">
            </a>
            <div class="card-body d-flex flex-column">
                <a href="{{ url_for('view_product', product_name=product.name) }}" class="card-title text-center mb-3" style="text-decoration: none; color: inherit;" onmouseover="this.style.color='#0d6efd';" onmouseout="this.style.color='inherit';">
                    <h5>{{ product.name }}</h5>
                </a>
                <div class="mt-auto d-flex justify-content-between align-items-center">
                    <h6 class="card-title pricing-card-title mb-0" style="font-size: 1.25rem;">{{ "%.2f"|format(product.price_with_tax) }} €<span class="text-body-secondary fw-light"></span></h6>
                    <form class="ajax-form" action="{{ url_for('manage_cart') }}" method="POST">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <input type="hidden" name="product_id" value="{{ product.id }}">
                        <input type="hidden" name="quantity" value="1" min="1">
                        <button type="submit" class="btn btn-outline-primary" style="font-size: 0.9rem;">Add to cart</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
</div>


{% endblock %}
